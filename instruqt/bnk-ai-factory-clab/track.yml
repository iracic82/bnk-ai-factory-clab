slug: bnk-ai-factory-clab
title: AI Factory on One VM - BNK, tenants, agents and the shadow agent
teaser: BIG-IP Next for Kubernetes on kind behind a real EVPN fabric. Three tenants, NVIDIA simulators,
  kagent agents on OpenShell and Agent Substrate, CalypsoAI guardrails through BNK iRules.
description: |-
  **One VM, a whole AI factory.**

  containerlab runs a spine/leaf/border fabric (FRR, BGP EVPN), an exit router and a client, and wires a
  three node kind cluster into the leaves. BNK 2.4.2 runs on that cluster in host mode with TMM peering
  with the fabric, the Polaris AI Gateway in front of NVIDIA Dynamo mocker workers, fake H100s scheduled by
  KAI, and kagent agents running on Agent Substrate inside OpenShell sandboxes.

  Then a developer at one tenant deploys an agent nobody approved. It uses only permitted tools, on a task
  that reads like real work, and the sequence is exfiltration. You watch identity, content inspection and
  reachability each fail to stop it alone, and stop it together: Polaris, a CalypsoAI verdict carried by a
  BNK iRule, OpenShell's network policy and BNK egress in the tenant VRF.
