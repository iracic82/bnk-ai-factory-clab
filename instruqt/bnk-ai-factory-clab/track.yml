slug: bnk-ai-factory-clab
id: megnpib5bsgz
title: The AI Factory and the Agent Nobody Approved
teaser: Run a complete AI factory on one machine, BIG-IP Next for Kubernetes on a
  real EVPN fabric with three tenants, simulated H100s and agents in sandboxes. Then
  catch the one agent that was never signed off.
description: |-
  **Three tenants share an AI factory. One of them is about to leak a hospital's records, and nobody wrote a
  single malicious line of code.**

  You get the whole factory on one VM: a spine/leaf fabric speaking BGP EVPN, BIG-IP Next for Kubernetes
  peering with it from inside a Kubernetes cluster, an AI gateway in front of NVIDIA model workers, H100s that
  exist only on paper but schedule like the real thing, and agents that run in sandboxes with nothing but a
  key they never get to see.

  Aurora Health, Borealis Bank and Cobalt Labs each get their own VRF, their own egress, their own models and
  their own assistant. You build and read all of it, chapter by chapter, with the routers' tables and the data
  plane's logs in front of you.

  Then a developer at Cobalt Labs deploys an agent of their own. It only uses tools the sanctioned assistant has.
  Its task reads like ordinary night-shift work. And step by step it assembles Aurora's patient queue and posts it
  to a webhook outside the factory.

  Identity does not stop it. A content scan on its own does not stop it. Reachability on its own does not either.
  You watch each layer fail alone, then watch them hold together: the AI gateway's keys, a CalypsoAI verdict
  carried inline by a BNK iRule, OpenShell's network policy around the sandbox, and BNK's egress in the tenant's
  VRF, where the packet is dropped before it reaches a router.

  The last chapter adds a model Northlight does not own. A semantic router decides which prompts leave for Amazon
  Bedrock, and one rule on the tenant's exit decides whether they can.

  Fifteen chapters, about four and a half hours, every command ready to run.
