<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="350" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Meet the agents</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Each tenant has an assistant with its own model, its own key and its own tools; the operator's agent sees the platform, nothing of the tenants</text><rect x="30" y="80" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="130.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Aurora assistant</text><text x="130.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">kagent Agent in tenant-a</text><text x="130.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">model tenant-a-qwen2.5-1.5b</text><text x="130.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">route 172.16.100.20</text><rect x="260" y="80" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="360.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Borealis assistant</text><text x="360.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">kagent Agent in tenant-b</text><text x="360.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">model tenant-b-qwen2.5-1.5b</text><text x="360.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">route 172.16.100.21</text><rect x="490" y="80" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="590.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Cobalt assistant</text><text x="590.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">kagent Agent in tenant-c</text><text x="590.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">model tenant-c-qwen2.5-1.5b</text><text x="590.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">route 172.16.100.22</text><rect x="720" y="80" width="230" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="835.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">factory-operator</text><text x="835.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">kagent namespace</text><text x="835.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">read-only Kubernetes tools</text><text x="835.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">lab tenant, route .13</text><rect x="30" y="220" width="440" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="250.0" y="240" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">tenant MCP server (agent:8001)</text><text x="250.0" y="260" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">lookup_record · tenant_identity · egress_check · reach_test</text><rect x="510" y="220" width="440" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="730.0" y="240" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Polaris AI Gateway</text><text x="730.0" y="260" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">one tenant per team, one virtual key per principal, every call recorded</text><line x1="130" y1="170" x2="130" y2="220" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/><text x="130.0" y="189.0" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">tools</text><line x1="610" y1="170" x2="610" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/><text x="610.0" y="189.0" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">model</text><text x="30" y="320" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Ask Aurora's assistant about its queue and watch the call appear in Polaris; the same key on Borealis's route is refused.</text></svg>
