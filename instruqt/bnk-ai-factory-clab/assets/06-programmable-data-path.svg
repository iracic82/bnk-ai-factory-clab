<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">The programmable data path</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Where the CRDs stop, an iRule continues: attached to a Gateway listener through a NetPolicy, running inside TMM</text><rect x="30" y="100" width="110" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="85.0" y="120" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">client</text><text x="85.0" y="140" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">via r5</text><rect x="180" y="70" width="260" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">TMM · Gateway tenant-gw (Borealis)</text><text x="310.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">172.16.100.17:80</text><text x="310.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">NetPolicy → F5BigCneIrule</text><text x="310.0" y="142" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">when HTTP_REQUEST { ... }</text><rect x="490" y="85" width="170" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="575.0" y="105" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">agent-web (tenant-b)</text><text x="575.0" y="125" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the tenant's app</text><text x="575.0" y="141" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">unchanged</text><rect x="710" y="70" width="240" height="120" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="830.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Access CRDs (2.4.x)</text><text x="830.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">F5BigAccessJwtConfig</text><text x="830.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">F5BigAccessOauthServer, ...</text><text x="830.0" y="142" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">JWT / OIDC at ingress</text><line x1="140" y1="130" x2="180" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="440" y1="130" x2="490" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><text x="465.0" y="124.0" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">stamped</text><line x1="180" y1="160" x2="140" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/><text x="160.0" y="186.0" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">/factory/whoami answered by TMM</text><text x="30" y="240" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">One policy object, two kinds of extension: an iRule here, a persistence profile in chapter 5, the guardrail sideband in chapter 11.</text><text x="30" y="260" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">The Access CRDs are read, not attached: an identity provider is outside this VM.</text></svg>
