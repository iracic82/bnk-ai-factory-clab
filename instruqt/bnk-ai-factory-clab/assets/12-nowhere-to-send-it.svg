<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Nowhere to send it</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">A clean prompt and the same webhook: the sandboxed agent is refused by OpenShell, the plain pod has no exit in its tenant VRF</text><rect x="30" y="80" width="240" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="150.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">sandboxed assistant</text><text x="150.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">OpenShell network policy</text><text x="150.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">allow-list: its AI route only</text><rect x="30" y="210" width="240" height="90" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="150.0" y="230" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">plain pod (tenant-c)</text><text x="150.0" y="250" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">no sandbox</text><text x="150.0" y="266" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">egress through TMM, VRF tenant-c</text><rect x="340" y="80" width="200" height="90" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="440.0" y="100" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">OpenShell</text><text x="440.0" y="120" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Consolas, Menlo, monospace">NET:OPEN DENIED</text><text x="440.0" y="136" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Consolas, Menlo, monospace">curl → 172.16.250.10:8080</text><rect x="340" y="210" width="200" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="440.0" y="230" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">TMM egress (tenant-c)</text><text x="440.0" y="250" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">F5SPKEgress removed:</text><text x="440.0" y="266" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">no path, packet dropped</text><rect x="620" y="140" width="150" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="695.0" y="160" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">border1 eth3.103</text><text x="695.0" y="180" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">tcpdump: nothing</text><rect x="820" y="140" width="130" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="885.0" y="160" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">client webhook</text><text x="885.0" y="180" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">log stays empty</text><line x1="270" y1="125" x2="340" y2="125" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="270" y1="255" x2="340" y2="255" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="540" y1="255" x2="620" y2="190" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="770" y1="180" x2="820" y2="180" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="30" y="335" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Reachability is the last layer: when there is no route and no policy allowing it, content and identity do not matter.</text></svg>
