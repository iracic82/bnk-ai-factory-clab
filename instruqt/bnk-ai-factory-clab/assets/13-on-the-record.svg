<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">On the record</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Four places, one timeline: who called what, which verdict TMM carried, what the sandbox refused, which egress existed</text><rect x="30" y="80" width="215" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="137.5" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Polaris console</text><text x="137.5" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">every model call</text><text x="137.5" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">key, tenant, model, tokens</text><rect x="265" y="80" width="215" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="372.5" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">TMM</text><text x="372.5" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">iRule verdicts</text><text x="372.5" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">X-Guardrail headers</text><rect x="500" y="80" width="215" height="100" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="607.5" y="100" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">OpenShell logs</text><text x="607.5" y="120" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">NET:OPEN DENIED</text><text x="607.5" y="136" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">binary, destination, reason</text><rect x="735" y="80" width="215" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="842.5" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Prometheus / Grafana</text><text x="842.5" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">vllm:* per worker</text><text x="842.5" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">picker decisions, GPU use</text><rect x="30" y="220" width="920" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="490.0" y="240" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the timeline of chapters 10 to 12, reconstructed from these four sources</text><line x1="137" y1="180" x2="300" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="372" y1="180" x2="420" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="607" y1="180" x2="540" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="842" y1="180" x2="660" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><text x="30" y="310" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">One question to answer at the end: who tried it, when, with which key, and where exactly it stopped.</text></svg>
