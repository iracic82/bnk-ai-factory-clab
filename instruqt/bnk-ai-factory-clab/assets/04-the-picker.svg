<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">The picker</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">F5's Endpoint Picker chooses the model worker per request from the workers' own KV-cache events and load</text><rect x="30" y="100" width="110" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="85.0" y="120" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">client</text><text x="85.0" y="140" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">via r5</text><rect x="180" y="90" width="170" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="265.0" y="110" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">TMM · pool VIP</text><text x="265.0" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">172.16.100.12:8000</text><text x="265.0" y="146" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">Gateway + HTTPRoute</text><rect x="390" y="70" width="200" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="490.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">F5EPP (engine dynamo)</text><text x="490.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">prefix-cache scorer</text><text x="490.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">prefill / queue / KV scorers</text><text x="490.0" y="142" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">NATS kv-events, vllm:* metrics</text><rect x="640" y="70" width="140" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="710.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">mocker worker 1</text><text x="710.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Dynamo DGD</text><rect x="640" y="140" width="140" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="710.0" y="160" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">mocker worker 2</text><text x="710.0" y="180" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Dynamo DGD</text><rect x="820" y="70" width="130" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="885.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">NATS</text><text x="885.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">kv-events</text><text x="885.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">per endpoint</text><line x1="140" y1="130" x2="180" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="350" y1="130" x2="390" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><text x="370.0" y="124.0" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">ext-proc</text><line x1="590" y1="95" x2="640" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><text x="615.0" y="89.0" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">pick</text><line x1="590" y1="165" x2="640" y2="165" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><line x1="780" y1="95" x2="820" y2="110" stroke="#d97706" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ah)"/><line x1="780" y1="165" x2="820" y2="150" stroke="#d97706" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ah)"/><text x="30" y="240" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Send the same prompt twice: the second lands where the prefix cache is. Load one worker: new requests move to the other.</text></svg>
