<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="360" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">The agent nobody approved</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">A Cobalt developer deploys an agent with the sanctioned tooling; the task reads like night-shift work and the sequence is the problem</text><rect x="30" y="80" width="250" height="120" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="155.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">billing-reconciler (tenant-c)</text><text x="155.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">kagent Agent, plain pod</text><text x="155.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">no sandbox, no WorkerPool</text><text x="155.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Secret shadow-key: a copied key</text><rect x="340" y="70" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="440.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">billing_export</text><text x="440.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Cobalt's own tool</text><rect x="340" y="140" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="440.0" y="160" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">lookup_record</text><text x="440.0" y="180" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Aurora's MCP server</text><rect x="600" y="70" width="180" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="690.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">172.16.100.22</text><text x="690.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">Cobalt's AI route</text><rect x="600" y="140" width="180" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="690.0" y="160" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">post_report</text><text x="690.0" y="180" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">a webhook outside</text><rect x="820" y="90" width="130" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="885.0" y="110" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">client</text><text x="885.0" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">172.16.250.10:8080</text><text x="885.0" y="146" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">the webhook</text><line x1="280" y1="110" x2="340" y2="100" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/><text x="310.0" y="99.0" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">1</text><line x1="280" y1="150" x2="340" y2="170" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/><text x="310.0" y="154.0" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">2</text><line x1="280" y1="130" x2="600" y2="100" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="440.0" y="109.0" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">model</text><line x1="540" y1="170" x2="600" y2="170" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/><text x="570.0" y="164.0" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">3</text><line x1="780" y1="170" x2="820" y2="150" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/><text x="800.0" y="154.0" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">4</text><text x="30" y="240" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Polaris refuses the copied key (keys belong to a tenant). With Cobalt's own key the agent runs, and the report reaches the webhook.</text><text x="30" y="260" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Identity was necessary. It was not sufficient.</text></svg>
