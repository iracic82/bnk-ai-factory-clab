<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">OpenShell</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">The runtime enforces what the agent may touch: a provider injects the key toward one host, the network policy refuses every other</text><rect x="30" y="80" width="300" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="180.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">sandbox tenant-a-agent</text><text x="180.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">supervisor + workload (gVisor)</text><text x="180.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">provider f5-aigw-tenant-a</text><text x="180.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">key never inside the sandbox</text><rect x="400" y="70" width="220" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="510.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">172.16.100.20 (Aurora's route)</text><text x="510.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">allowed · key injected</text><rect x="400" y="160" width="220" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="510.0" y="180" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">172.16.100.21 (Borealis)</text><text x="510.0" y="200" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">DENIED by policy</text><rect x="690" y="70" width="260" height="160" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="820.0" y="90" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">openshell CLI</text><text x="820.0" y="110" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Consolas, Menlo, monospace">policy get / policy update</text><text x="820.0" y="126" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Consolas, Menlo, monospace">logs --source sandbox</text><text x="820.0" y="142" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Consolas, Menlo, monospace">NET:OPEN [MED] DENIED ...</text><text x="820.0" y="158" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Consolas, Menlo, monospace">every refusal is a log line</text><line x1="330" y1="110" x2="400" y2="105" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/><line x1="330" y1="170" x2="400" y2="195" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="30" y="260" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Add a host to the policy and the same call succeeds; put the base policy back and it is refused again. No pod restart in between.</text></svg>
