<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="350" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Agent Substrate</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">A scheduler and an egress path of their own for agents: WorkerPool, ActorTemplate, SandboxAgent</text><rect x="30" y="80" width="200" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="130.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">kagent controller</text><text x="130.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">SandboxAgent →</text><text x="130.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">ActorTemplate (generated)</text><rect x="280" y="60" width="300" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="430.0" y="80" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">ate-system</text><text x="430.0" y="100" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">ate-api-server · ate-controller</text><text x="430.0" y="116" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">atelet on every node</text><text x="430.0" y="132" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">atenet-router (agentgateway) · atenet-dns</text><text x="430.0" y="148" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">pod certificates, mTLS everywhere</text><rect x="630" y="70" width="320" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="790.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">WorkerPool kagent-default</text><text x="790.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">2 workers, sandboxClass gvisor</text><text x="790.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">one golden snapshot per template</text><text x="790.0" y="142" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">actors forked from it in milliseconds</text><line x1="230" y1="125" x2="280" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="580" y1="125" x2="630" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><text x="605.0" y="119.0" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">schedules actors</text><rect x="280" y="230" width="300" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="430.0" y="250" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the model call</text><text x="430.0" y="270" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">actor → atenet-router → AI Gateway route</text><text x="430.0" y="286" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the only way out</text><line x1="790" y1="180" x2="430" y2="230" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/><text x="30" y="330" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Compare: a plain pod gets scheduled, started and torn down by kubelet. An actor is forked from a warm snapshot on a worker.</text></svg>
