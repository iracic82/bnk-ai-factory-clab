<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Topology as a contract</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">llm-d scores workers by where they sit (rack, rail); BNK's picker scores by cache and load. What each one knows</text><rect x="30" y="80" width="260" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="160.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">F5EPP scorers</text><text x="160.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">prefix-cache · prefill load</text><text x="160.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">queue depth · KV usage</text><text x="160.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">no rack, no rail, no NIC</text><rect x="340" y="80" width="260" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="470.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">llm-d inference scheduler</text><text x="470.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">topology-aware P/D pairing</text><text x="470.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">labels on the pods</text><text x="470.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the router must see the layout</text><rect x="650" y="80" width="300" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="800.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">mocker pods, labelled</text><text x="800.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">topology.kubernetes.io/rack</text><text x="800.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">factory.lab/rail</text><text x="800.0" y="152" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">what a topology scorer would read</text><line x1="290" y1="135" x2="340" y2="135" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="315.0" y="129.0" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">vs</text><line x1="600" y1="135" x2="650" y2="135" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="30" y="240" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Optional chapter: label the workers, read the picker's config, and see which signals reach the router today and which do not.</text></svg>
