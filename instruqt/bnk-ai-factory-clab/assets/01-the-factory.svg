<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">One VM, a whole factory</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">containerlab wires an FRR EVPN fabric, an exit router, a client and a three node kind cluster together on one machine</text><rect x="30" y="90" width="120" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="90.0" y="110" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">client</text><text x="90.0" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">172.16.250.10</text><rect x="190" y="90" width="100" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="240.0" y="110" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">r5</text><text x="240.0" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">AS 65500</text><rect x="330" y="90" width="110" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="385.0" y="110" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">border1</text><text x="385.0" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">VRF-lite to r5</text><rect x="480" y="70" width="220" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="590.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">spine1 / spine2</text><text x="590.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">eBGP unnumbered</text><text x="590.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">EVPN route reflector</text><rect x="740" y="90" width="100" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="790.0" y="110" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">leaf1</text><text x="790.0" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">L3VNI 10000-3</text><rect x="740" y="190" width="220" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="850.0" y="210" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">bnk-worker  ·  TMM</text><text x="850.0" y="230" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">eth1 = leaf1 eth3 (untagged + VLAN 101-103)</text><text x="850.0" y="246" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">self IP 172.16.10.11, BGP AS 65100</text><rect x="480" y="190" width="220" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="590.0" y="210" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">bnk-control-plane · bnk-worker2</text><text x="590.0" y="230" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">kind v1.35.5, Calico, Multus</text><text x="590.0" y="246" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Dynamo, picker, agents</text><line x1="150" y1="120" x2="190" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="290" y1="120" x2="330" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="440" y1="120" x2="480" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="700" y1="120" x2="740" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="790" y1="150" x2="790" y2="190" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/><text x="790.0" y="164.0" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">handoff</text><line x1="700" y1="245" x2="740" y2="245" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="30" y="215" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">A request from the client to a VIP crosses: r5 → border1 (VRF) → EVPN → leaf1 → TMM → pod.</text><text x="30" y="235" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">This chapter reads each hop's table before anything changes.</text></svg>
