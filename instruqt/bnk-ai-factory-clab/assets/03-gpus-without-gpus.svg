<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="320" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">GPUs without GPUs</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">The fake GPU operator advertises H100s the kernel has never seen; KAI schedules them with one queue per tenant</text><rect x="30" y="80" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="130.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">fake GPU operator</text><text x="130.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">4 x NVIDIA-H100-80GB-HBM3</text><text x="130.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">per worker, device plugin + DCGM</text><rect x="270" y="80" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="370.0" y="100" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">KAI scheduler</text><text x="370.0" y="120" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">queue tree, quotas,</text><text x="370.0" y="136" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">fair share, preemption</text><rect x="510" y="60" width="440" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="730.0" y="80" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">queues</text><rect x="530" y="95" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="590.0" y="115" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">tenant-a</text><text x="590.0" y="135" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Aurora, 4 GPUs</text><rect x="670" y="95" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="730.0" y="115" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">tenant-b</text><text x="730.0" y="135" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Borealis, 2</text><rect x="810" y="95" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="870.0" y="115" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">tenant-c</text><text x="870.0" y="135" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Cobalt, 2</text><line x1="230" y1="125" x2="270" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="470" y1="125" x2="510" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><text x="30" y="225" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">A training Job asks for nvidia.com/gpu; the scheduler places it inside its tenant's quota and parks what does not fit.</text><text x="30" y="245" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Grafana and Prometheus show the simulated utilisation per node and per queue.</text></svg>
