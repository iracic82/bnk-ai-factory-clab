, sans-serif">message/send</text><text x="30" y="345" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Scale the MCP server to three. Without the profile a session's follow-ups land anywhere; with it they stay where the session lives.</text></svg>
