<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="980" height="340" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Guardrails in the data path</text><text x="24" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">A CalypsoAI verdict carried inline by a BNK iRule: the request is scanned where it flows, before the model sees it</text><rect x="30" y="100" width="180" height="70" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="120.0" y="120" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">billing-reconciler</text><text x="120.0" y="140" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">same task again</text><rect x="260" y="70" width="260" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="390.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">TMM · Gateway tenant-c-ai</text><text x="390.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">NetPolicy guardrails-tenant-c</text><text x="390.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">iRule: collect body, sideband scan,</text><text x="390.0" y="142" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">flagged → HTTP 200 + X-Guardrail: blocked</text><rect x="570" y="70" width="180" height="60" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="660.0" y="90" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">CalypsoAI</text><text x="660.0" y="110" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">/backend/v1/scans</text><text x="660.0" y="126" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">mock or the real service</text><rect x="570" y="140" width="180" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="660.0" y="160" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the model</text><text x="660.0" y="180" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">never reached</text><line x1="210" y1="135" x2="260" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><line x1="520" y1="100" x2="570" y2="100" stroke="#be185d" stroke-width="2" marker-end="url(#ah)"/><text x="545.0" y="94.0" font-size="11" font-weight="600" fill="#be185d" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">sideband</text><line x1="520" y1="170" x2="570" y2="170" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/><rect x="800" y="70" width="150" height="130" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="875.0" y="90" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the record</text><text x="875.0" y="110" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Polaris: the call</text><text x="875.0" y="126" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">TMM: the verdict</text><text x="875.0" y="142" font-size="11.5" font-weight="400" fill="#e2e8f0" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">the agent: blocked</text><text x="30" y="240" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Attach the policy to Cobalt's gateway with one kubectl apply. Rerun. The export never leaves the data plane.</text></svg>
