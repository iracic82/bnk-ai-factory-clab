<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northlight AI factory topology</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One wide SVG of the factory as it is built on this VM, a flow picker above it, a numbered step rail beside it.
   Dark on purpose: it sits next to the Polaris console tab. Same shape as the bnk-ai-gateway lab's page. */
:root {
  color-scheme: dark;
  --bg: #0e1116; --panel: #151a22; --line: #2a3240; --ink: #e6e9ef; --dim: #8a94a6;
  --tmm: #e4002b; --fab: #58a6ff; --ten: #7ee787; --ai: #f0a040; --agent: #c792ea; --deny: #ff5c7a; --ctrl: #6aa8ff; --bad: #ffd166;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font-family: var(--sans); font-size: 14px; padding: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
.sub { color: var(--dim); margin: 4px 0 14px; max-width: 90ch; }
.flows { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.flows button { font: 500 13px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.flows button[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 -2px 0 var(--c); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; } }
.canvas { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
svg { display: block; min-width: 1000px; width: 100%; height: auto; }
.zone { fill: none; stroke: var(--line); stroke-width: 1.5; }
.zonename { font: 600 12px var(--sans); fill: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
.box rect { fill: #1b2230; stroke: var(--line); stroke-width: 1.2; rx: 6; }
.box text { fill: var(--ink); font: 500 12.5px var(--sans); }
.box .m { font: 400 10.5px var(--mono); fill: var(--dim); }
.box.tmm > rect { fill: #1d1418; stroke: var(--tmm); }
.box.bad > rect { stroke: var(--bad); stroke-dasharray: 5 4; fill: #23200f; }
.box.lit rect { stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--glow)); }
.box.live-ok rect { stroke: #2ea043; }
.box.live-down rect { stroke: var(--deny); stroke-width: 2; }
.wire { stroke: #3a4456; stroke-width: 3; fill: none; }
.wirelabel { font: 400 10.5px var(--mono); fill: var(--dim); }
.seg { fill: none; stroke-width: 4; stroke-linecap: round; opacity: 0; transition: opacity .25s; }
.seg.on { opacity: 1; } .seg.dash { stroke-dasharray: 8 7; }
.pkt { r: 7; opacity: 0; filter: drop-shadow(0 0 5px currentColor); }
.rail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.rail h2 { font-size: 15px; margin: 0 0 4px; }
.status { font: 500 11px var(--mono); color: var(--dim); display: inline-block; margin-bottom: 10px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 10px; }
.status.ok { color: var(--ten); border-color: var(--ten); } .status.ch { color: var(--ai); border-color: var(--ai); }
ol { margin: 0; padding-left: 22px; } li { margin: 0 0 9px; color: var(--dim); line-height: 1.42; }
li.cur { color: var(--ink); } li code, .why code { font: 500 12px var(--mono); color: var(--ink); background: #0e1116; padding: 1px 5px; border-radius: 4px; }
.ctl { display: flex; gap: 8px; margin: 12px 0; }
.ctl button { font: 500 13px var(--sans); color: var(--ink); background: #1b2230; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.why { color: var(--dim); font-size: 13px; border-top: 1px solid var(--line); padding-top: 10px; line-height: 1.45; }
.live { font: 400 11.5px var(--mono); color: var(--dim); margin-top: 10px; }
body.still .flows, body.still .ctl, body.still .live { display: none; }
</style>
</head>

<script>
// Paths share the SVG coordinate system. Each flow is a list of hops: a path, a colour, the boxes to light, a sentence.
const P = {
  cliR5:   "M111 166 V196",
  r5Bord:  "M111 252 V282",
  bordSp1: "M186 317 H206 V223 H230",
  sp1Leaf: "M340 223 H380",

  polMock: "M1191 166 V180",
  cliTmm:  "M111 166 V196 M111 252 V282 M186 317 H206 V223 H230 M340 223 H380 M550 243 H612 V207 H640",
  tmmMcp:  "M852 207 H900 V281 H932",
  tmmA2a:  "M852 207 H900 V528 H932",

  sbxDeny: "M1108 528 H1098 V440 H1060",
  shadowTa:"M932 459 H900 V281 H932",
  shadowPol:"M932 459 H900 V140 H932 M1098 138 H1108",
  shadowOut:"M1103 482 V560 H960 V580 M612 610 H596 V289 H640 M746 274 V224 M640 190 H612 V243 H550 M380 223 H340 M230 223 H206 V317 H186 M111 282 V252 M111 196 V166 M111 166 V420",
  tmmGuard:"M852 207 H900 V598 H1108",
  guardTmm:"M1108 598 H900 V207 H852",
  tmmBack: "M852 207 H900 V459 H932",
  shadowDrop:"M1103 482 V560 H960 V580 M612 610 H596 V289 H640",
  ctrlTmm: "M932 138 H900 V215 H864",
  ctrlPol: "M1098 138 H1108",
  subKag:  "M1015 570 V556",
  kagSub:  "M1015 556 V570",
  subAi:   "M1098 598 H1100 V289 H852",
};
const C = { fab:"var(--fab)", tmm:"var(--tmm)", ten:"var(--ten)", ai:"var(--ai)", agent:"var(--agent)", deny:"var(--deny)", ctrl:"var(--ctrl)", bad:"var(--bad)" };
const FLOWS = [
 { id:"setup", label:"How it is built", color:C.ctrl, status:["ok","chapter 1"], steps:[
    {p:"ctrlTmm", c:C.ctrl, d:true, lit:["n-ctrl","n-tmm","n-cp"], t:"You declare on Kubernetes: a <code>CNEInstance</code>, <code>Vrf</code>s, <code>F5SPKVlan</code> legs, <code>RoutingConfig</code>s, Gateways. The lifecycle operator and <code>f5-cne-controller</code> turn them into TMM configuration over gRPC."},
    {p:"leafW", c:C.ctrl, d:true, lit:["n-leaf1","n-worker","n-ext"], t:"containerlab wired <code>bnk-worker eth1</code> to <code>leaf1 eth3</code>. TMM's external leg is a macvlan on it: untagged for VRF external, VLAN 101 to 103 for the tenants. Four BGP sessions, one veth."},
    {p:"ctrlPol", c:C.ctrl, d:true, lit:["n-polaris","n-ctrl"], t:"The same controller runs the Polaris AI Gateway: tenants, provider keys, models, virtual keys and routes, each route a Gateway on a VIP from the pool."}],
   why:"Everything is a declaration. Chapter 1 reads the result on every hop before anything changes." },
 { id:"vip", label:"A client reaches a tenant VIP", color:C.fab, status:["ok","chapter 1 and 2"], steps:[
    {p:"cliR5", c:C.fab, lit:["n-client","n-r5"], t:"The client sends <code>GET http://10.201.100.10/</code>, Aurora's first VIP. r5 has the /32 from border1's tenant-a sub-interface."},
    {p:"r5Bord", c:C.fab, lit:["n-border"], t:"border1 receives it in VRF tenant-a and forwards on the L3VNI: the packet becomes VXLAN towards leaf1's VTEP."},
    {p:"bordSp1", c:C.fab, lit:["n-spine1"], t:"Over the underlay: eBGP unnumbered, loopback to loopback, either spine."},
    {p:"sp1Leaf", c:C.fab, lit:["n-leaf1"], t:"leaf1 decapsulates into VRF tenant-a. The /32 came from TMM over eBGP on VLAN 101, so the next hop is TMM's self IP <code>172.17.101.11</code>."},
    {p:"leafW", c:C.tmm, lit:["n-ext","n-tmm"], t:"Out of <code>eth3</code> tagged 101, into <code>bnk-worker eth1</code>, into TMM's VLAN leg <code>fab-a</code>. The client's address is untouched all the way here."},
    {p:"vipTen", c:C.ten, lit:["n-vips","n-ta"], t:"The virtual server in route domain tenant-a load balances to Aurora's hello pods with SNAT automap. The answer goes back the same way."}],
   why:"The fabric sees the tenant as a VRF end to end; leaf1 accepts only the VIP pool and the SNAT pool from TMM; r5 is an ordinary upstream." },
 { id:"egress", label:"A tenant pod leaves the factory", color:C.ten, status:["ok","chapter 2 and 12"], steps:[
    {p:"podCsrc", c:C.ten, lit:["n-tc","n-csrc"], t:"A pod in tenant-c opens a connection to the outside. The <code>F5SPKEgress</code> for the namespace steers it into a VXLAN tunnel from its node to TMM's internal self IP."},
    {p:"csrcInt", c:C.ten, lit:["n-int"], t:"TMM receives it on its internal leg, in route domain tenant-c, and SNATs it from the tenant's pool <code>10.203.200.0/24</code>."},
    {p:"intExt", c:C.tmm, lit:["n-tmm","n-ext"], t:"Routing in the VRF: the default route came from leaf1 over eBGP on VLAN 103."},
    {p:"extLeaf", c:C.fab, lit:["n-leaf1"], t:"leaf1 VRF tenant-c, then a type-5 towards border1."},
    {p:"spBord", c:C.fab, lit:["n-border","n-r5"], t:"border1 to r5 on the tenant-c sub-interface. r5 accepted the SNAT pool from that VRF, so the return path exists."},
    {p:"cliWh", c:C.ten, lit:["n-client","n-webhook"], t:"The client, or the webhook on it, sees <code>10.203.200.x</code>, never a pod address. Delete the <code>F5SPKEgress</code> and this flow has no first hop: that is chapter 12."}],
   why:"Egress is a declaration per namespace: a tunnel, a route domain, a SNAT pool. Without it a pod has no way out through TMM." },
 { id:"aigw", label:"An agent calls its model", color:C.ai, status:["ok","chapter 9"], steps:[
    {p:"agentInt", c:C.agent, lit:["n-ta","n-int"], t:"Aurora's assistant posts to <code>http://172.16.100.20/v1/chat/completions</code> with Aurora's virtual key. The node routes <code>172.16.100.0/24</code> to TMM's internal self IP."},
    {p:"intPol", c:C.tmm, lit:["n-tmm","n-vips","n-polaris"], t:"The route is a Gateway on the VIP pool with Polaris's profile: key valid, tenant matches, model in scope, limits and budget, then a provider is chosen. A key from another tenant stops here with 401."},
    {p:"polMock", c:C.ai, lit:["n-mocker","n-ta"], t:"The deployment for <code>tenant-a-qwen2.5-1.5b</code> is ollama on the VM; for the Dynamo model it is the mocker frontend. Tokens are metered and the call is recorded under the key."}],
   why:"Pods never need the fabric to reach their model: the AI routes are reachable through TMM's internal leg. Keys and model names belong to a tenant." },
 { id:"picker", label:"The pool VIP and the picker", color:C.ai, status:["ok","chapter 4"], steps:[
    {p:"cliTmm", c:C.fab, lit:["n-client","n-ext","n-vips"], t:"A request to the pool VIP <code>172.16.100.12:8000</code> crosses the fabric like any published VIP."},
    {p:"polPick", c:C.ctrl, d:true, lit:["n-picker"], t:"The HTTPRoute's backend is an <code>InferencePool</code>; TMM asks F5's Endpoint Picker, engine <code>dynamo</code>, which worker should take this prompt."},
    {p:"pickMock", c:C.ai, lit:["n-mocker"], t:"The picker scores prefix-cache hits (from KV events on NATS), prefill load, queue depth and KV usage, and names a worker. TMM sends the request there."}],
   why:"The picker is cache- and load-aware. It knows nothing about rack or rail; chapter 14 puts those labels on and shows what the router can and cannot see." },
 { id:"mcp", label:"MCP and A2A sessions stick", color:C.agent, status:["ch","chapter 5"], steps:[
    {p:"cliTmm", c:C.agent, lit:["n-client","n-ext"], t:"A client starts an MCP session on Aurora's MCP gateway <code>172.16.100.23</code>; the answer carries <code>Mcp-Session-Id</code>."},

const $ = id => document.getElementById(id);
const segs = $("segs"), pkt = $("pkt");
let flow = FLOWS[0], step = 0, timer = null, anim = null;
const still = /-still$/.test(location.hash);
if (still) document.body.classList.add("still");
function render() {
  segs.innerHTML = "";
  document.querySelectorAll(".box.lit").forEach(b => b.classList.remove("lit"));
  flow.steps.forEach((s, i) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.setAttribute("d", P[s.p]); el.setAttribute("class", "seg" + (s.d ? " dash" : "") + ((i <= step || still) ? " on" : ""));
    el.style.stroke = s.c; el.style.opacity = (i === step || still) ? 1 : (i < step ? .35 : 0);
    segs.appendChild(el);
  });
  const lit = still ? flow.steps.flatMap(s => s.lit) : flow.steps[step].lit;
  lit.forEach(id => { const n = $(id); if (n) { n.classList.add("lit"); n.style.setProperty("--glow", flow.steps[step].c); } });
  $("ftitle").textContent = flow.label;
  const st = $("fstatus"); st.className = "status " + flow.status[0]; st.textContent = flow.status[1];
  $("steps").innerHTML = flow.steps.map((s, i) => `<li class="${i === step || still ? "cur" : ""}">${s.t}</li>`).join("");
  $("fwhy").innerHTML = flow.why;
  document.querySelectorAll("#flows button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === flow.id)));
  if (!still) movePacket();
}
function movePacket() {
  cancelAnimationFrame(anim);
  const path = segs.children[step]; if (!path) return;
  const len = path.getTotalLength(), t0 = performance.now(), dur = Math.max(600, len * 2.2);
  pkt.style.fill = flow.steps[step].c; pkt.style.color = flow.steps[step].c; pkt.style.opacity = 1;
  const tick = now => { const k = Math.min(1, (now - t0) / dur), pt = path.getPointAtLength(k * len);
    pkt.setAttribute("cx", pt.x); pkt.setAttribute("cy", pt.y); if (k < 1) anim = requestAnimationFrame(tick); };
  anim = requestAnimationFrame(tick);
}
function go(i) { step = Math.max(0, Math.min(flow.steps.length - 1, i)); render(); }
function pick(id) { flow = FLOWS.find(f => f.id === id) || FLOWS[0]; stop(); go(0); }
function stop() { clearInterval(timer); timer = null; $("play").textContent = "Play"; }
$("next").onclick = () => { stop(); go(step + 1); };
$("prev").onclick = () => { stop(); go(step - 1); };
$("play").onclick = () => { if (timer) return stop(); $("play").textContent = "Pause"; timer = setInterval(() => step < flow.steps.length - 1 ? go(step + 1) : stop(), 2600); };
$("flows").innerHTML = FLOWS.map(f => `<button type="button" data-id="${f.id}" style="--c:${f.color}"><i class="dot"></i>${f.label}</button>`).join("");
$("flows").onclick = e => { const b = e.target.closest("button"); if (b) pick(b.dataset.id); };
const want = location.hash.replace(/^#/, "").replace(/-still$/, "");
pick(FLOWS.some(f => f.id === want) ? want : "setup");
if (still) { step = flow.steps.length - 1; render(); }
// live state from /api/topology (scripts/topology-api.py): colour the boxes that have a live source
const LIVE = { client:"n-client", r5:"n-r5", border1:"n-border", spine1:"n-spine1", spine2:"n-spine2", leaf1:"n-leaf1", leaf2:"n-leaf2",
  "bnk-worker":"n-worker", "bnk-worker2":"n-worker2", "bnk-control-plane":"n-cp", tmm:"n-tmm", ctrl:"n-ctrl", polaris:"n-polaris",
  picker:"n-picker", mocker:"n-mocker", "tenant-a-ai":"n-ta", "tenant-b-ai":"n-tb", "tenant-c-ai":"n-tc", substrate:"n-substrate",
  "tenant-c/billing-reconciler":"n-shadow", "sb-tenant-a":"n-openshell", "tenant-a/assistant":"n-kagent" };
async function live() {
  if (still) return;
  try {
    const d = await (await fetch("api/topology", {cache:"no-store"})).json();
    let ok = 0, down = 0;
    d.nodes.forEach(n => { const id = LIVE[n.id]; if (!id) return; const el = $(id); if (!el) return;
      el.classList.remove("live-ok", "live-down"); if (n.ok === true) { el.classList.add("live-ok"); ok++; } else if (n.ok === false) { el.classList.add("live-down"); down++; } });
    const sb = Object.keys(d.summary.sandboxes || {}).length || d.summary.sandboxes;
    $("live").textContent = `live ${d.generated}: ${ok} up, ${down} down · BGP ${Object.entries(d.summary.bgp).map(([k,v])=>k+":"+v).join(" ") || "none"} · ${d.summary.agents} agents · ${sb} sandboxes`;
  } catch (e) { $("live").textContent = "live state unavailable"; }
}
live(); setInterval(live, 10000);
