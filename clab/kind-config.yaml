# kind cluster for BNK. Same shape as bnk-deploy's own CI (ci/kind-multi.yaml): Calico instead of kindnet,
# because FLO's preflight has to recognise the CNI, and the pod CIDR bnk-deploy's lab environment expects.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bnk
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    # NodePorts published on the host: Polaris console, Grafana, Prometheus, kagent UI. Bound to loopback, so on a
    # workstation nothing listens on the LAN. The Instruqt bake rewrites listenAddress to the VM's address, because
    # Instruqt's tab proxy connects to the VM, not to localhost; the sandbox network is private to the learner.
    extraPortMappings:
      - {containerPort: 30443, hostPort: 30443, listenAddress: "127.0.0.1"}
      - {containerPort: 30300, hostPort: 30300, listenAddress: "127.0.0.1"}
      - {containerPort: 30909, hostPort: 30909, listenAddress: "127.0.0.1"}
      - {containerPort: 30808, hostPort: 30808, listenAddress: "127.0.0.1"}
  - role: worker        # bnk-worker: TMM lives here (app=f5-tmm), eth1 to leaf1
  - role: worker        # bnk-worker2: sims, agents, fake GPUs, eth1 to leaf2
