# kind cluster for BNK. Same shape as bnk-deploy's own CI (ci/kind-multi.yaml): Calico instead of kindnet,
# because FLO's preflight has to recognise the CNI, and the pod CIDR bnk-deploy's lab environment expects.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bnk
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/12"
# Agent Substrate v0.0.11 needs the PodCertificateRequest API, which exists from Kubernetes 1.34. BNK's installer pins
# 1.30 (kindest/node v1.30.13), and asking 1.30 for that feature gate stops the API server from starting (bake of
# 2026-10-31: kubeadm init timed out). So no gates here; install/50-agents.sh installs Substrate only where the API
# exists. Moving the cluster to 1.35 (supported by BNK 2.4.x) is the way to get Substrate back.
nodes:
  - role: control-plane
    # No port mappings here: the UIs (Polaris console, Grafana, Prometheus, kagent) are published by socat units on
    # the host that follow each Service's ClusterIP (install/lib/expose.sh), bound to loopback on a workstation and
    # to the VM address on Instruqt, where the tab proxy connects to the VM and the sandbox network is private.
  - role: worker        # bnk-worker: TMM lives here (app=f5-tmm), eth1 to leaf1
  - role: worker        # bnk-worker2: sims, agents, fake GPUs, eth1 to leaf2
