# Mock Calypso AI guardrail service. The BNK iRule opens a sideband connection to this and POSTs the
# prompt to /backend/v1/scans. It answers {"outcome":"flagged"} for a prompt that trips the policy, or
# {"outcome":"pass"} otherwise, which is the exact shape the real Calypso AI returns. In production this
# is Calypso AI (a SaaS reached through a proxy); here it is a self-contained stand-in so the lab runs
# offline. The value the demo shows is BNK enforcing the verdict in the data path, whatever returns it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-calypso-code
  namespace: guardrails
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    # Stands in for CalypsoAI's scanners with the shapes the story needs: patient identifiers (MRN, national ID,
    # payment card), the exfiltration verbs the shadow agent uses, and a few classic abuse words. Same wire format
    # as the real service: POST /backend/v1/scans, verdict in "outcome" ("flagged" or "pass").
    import re
    PATTERNS = [
        r"\bMRN[-\s:]?\d{6,}\b",                      # medical record numbers
        r"\b\d{3}-\d{2}-\d{4}\b",                     # national ID / SSN shape
        r"\b(?:\d[ -]?){13,16}\b",                      # payment card shape
        r"\b(?:patient|clinical)\s+(?:record|export|identifier)s?\b",
        r"\b(?:post|send|upload|forward)\b.{0,60}\b(?:webhook|hooks\.|external|outside)\b",
        r"\b(?:exfil|exfiltrat)\w*\b",
    ]
    BLOCK = ["password", "credit card", "social security", "malware", "ransomware", "sql injection", "ddos"]
    RX = [re.compile(p, re.I | re.S) for p in PATTERNS]

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _send(self, obj, code=200):
            raw = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_POST(self):
            n = int(self.headers.get("Content-Length", "0"))
            raw = self.rfile.read(n).decode("utf-8", "replace")
            body = raw.lower()
            flagged = any(k in body for k in BLOCK) or any(r.search(raw) for r in RX)
            self._send({"outcome": "flagged" if flagged else "pass"})

        def do_GET(self):
            if self.path == "/healthz":
                self._send({"ok": True})
            else:
                self._send({"error": "not found"}, 404)

        def log_message(self, *a):
            return

    if __name__ == "__main__":
        print("mock-calypso on :8080", flush=True)
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-calypso
  namespace: guardrails
  labels: {app: mock-calypso}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-calypso}}
  template:
    metadata:
      labels: {app: mock-calypso}
    spec:
      nodeSelector: {workload: ai}
      containers:
      - name: server
        image: python:3.12-slim
        command: ["python3", "/app/server.py"]
        ports: [{name: http, containerPort: 8080}]
        volumeMounts:
        - {name: code, mountPath: /app}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 5
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits: {cpu: "250m", memory: "128Mi"}
      volumes:
      - name: code
        configMap: {name: mock-calypso-code}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-calypso-svc
  namespace: guardrails
spec:
  selector: {app: mock-calypso}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mock-from-tmm-only, namespace: guardrails}
spec:
  podSelector: {matchLabels: {app: mock-calypso}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: f5-bnk}}
    - ipBlock: {cidr: __INTERNAL_SELFIP__/32}
    ports: [{port: 8080, protocol: TCP}]
