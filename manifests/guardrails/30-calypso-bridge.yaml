# The bridge to the real CalypsoAI service, used only when a key is present (install/60-guardrails.sh). A BNK iRule
# opens a plain TCP sideband inside the cluster; this pod takes that plaintext scan request, adds the bearer token,
# and forwards it over TLS to the CalypsoAI API, so the token never sits in an iRule and TMM needs no TLS egress
# of its own. Same path and verdict shape as the mock: POST /backend/v1/scans -> {"outcome": ...}.
#
# To confirm against the CalypsoAI API reference before the real run: the scan request body (the mock and the lb POC
# iRule send {"input": "<text>"}), whether a project id is required (CALYPSO_PROJECT_ID is added when set), and the
# verdict field (the POC's simulator used result.outcome with cleared/flagged/redacted; this bridge maps "cleared"
# to "pass" and anything else that is not "pass" to "flagged", so the iRule fails closed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: calypso-bridge-code
  namespace: guardrails
data:
  bridge.py: |
    import json, os, ssl, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ.get("CALYPSO_URL", "https://us2.calypsoai.app/backend/v1/scans")
    TOKEN = open("/secrets/api-key").read().strip()
    PROJECT = os.environ.get("CALYPSO_PROJECT_ID", "")
    CTX = ssl.create_default_context()

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def _send(self, obj, code=200):
            raw = json.dumps(obj).encode()
            self.send_response(code); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw))); self.end_headers(); self.wfile.write(raw)
        def do_GET(self):
            self._send({"ok": True, "upstream": UPSTREAM}) if self.path == "/healthz" else self._send({"error": "not found"}, 404)
        def do_POST(self):
            n = int(self.headers.get("Content-Length", "0"))
            try:
                body = json.loads(self.rfile.read(n) or b"{}")
            except ValueError:
                return self._send({"outcome": "flagged", "reason": "bad json"})
            if PROJECT and "project_id" not in body:
                body["project_id"] = PROJECT
            req = urllib.request.Request(UPSTREAM, data=json.dumps(body).encode(), method="POST",
                                         headers={"Content-Type": "application/json", "Authorization": f"Bearer {TOKEN}"})
            try:
                with urllib.request.urlopen(req, timeout=8, context=CTX) as r:
                    res = json.loads(r.read() or b"{}")
            except urllib.error.HTTPError as e:
                return self._send({"outcome": "flagged", "reason": f"upstream {e.code}"})
            except Exception as e:
                return self._send({"outcome": "flagged", "reason": type(e).__name__})
            verdict = (res.get("result") or {}).get("outcome") or res.get("outcome") or "flagged"
            self._send({"outcome": "pass" if verdict in ("pass", "cleared") else "flagged", "upstream_outcome": verdict})
        def log_message(self, *a): return

    print("calypso-bridge on :8080 ->", UPSTREAM, flush=True)
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calypso-bridge
  namespace: guardrails
  labels: {app: calypso-bridge}
spec:
  replicas: 1
  selector: {matchLabels: {app: calypso-bridge}}
  template:
    metadata:
      labels: {app: calypso-bridge}
    spec:
      nodeSelector: {workload: ai}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: bridge
        image: python:3.12-slim
        command: ["python3", "/app/bridge.py"]
        env:
        - {name: CALYPSO_URL, value: "https://us2.calypsoai.app/backend/v1/scans"}
        - name: CALYPSO_PROJECT_ID
          valueFrom: {secretKeyRef: {name: calypso, key: project-id, optional: true}}
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: code, mountPath: /app}
        - {name: secrets, mountPath: /secrets, readOnly: true}
      volumes:
      - name: code
        configMap: {name: calypso-bridge-code}
      - name: secrets
        secret: {secretName: calypso, items: [{key: api-key, path: api-key}]}
---
apiVersion: v1
kind: Service
metadata: {name: calypso-bridge, namespace: guardrails}
spec: {selector: {app: calypso-bridge}, ports: [{port: 8080, targetPort: 8080}]}
