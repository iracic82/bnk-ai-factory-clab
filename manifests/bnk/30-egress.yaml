# Per-tenant egress: one F5SPKEgress per application namespace (pseudoCNIConfig.namespaces takes exactly one), each
# with its own SNAT pool in the tenant's VRF, so a tenant's pods always leave through that tenant's VRF with that
# tenant's addresses (leaf1 accepts the pool from TMM, border1 passes it to r5). pseudoCNIConfig.vxlan.create builds the
# node -> TMM tunnel on the tenant's own leg (int-a/b/c in 10-network.yaml), the one VLAN of the tenant VRF on TMM's
# internal interface: that keeps the tunnel's endpoints, the pod rules and the SNAT exit in one route domain. addressList: one inner list per TMM replica. The webhook wants the tunnel's
# IPv4 and IPv6 subnets together; the IPv6 one is unused.
# The firewall: this BNK instance runs with the AFM firewall ACL on (bnk-deploy host profile), and an egress listener
# under AFM forwards nothing unless the F5SPKEgress names an enforced policy. Without it (play 6, 2026-11-01) TMM
# counted every pod SYN as a connection on f5-bnk-tenant-c-egress-egress-ipv4 and sent nothing on any leg. One
# accept-all policy per tenant, egress-allow-<x>: the policy is the one part of a tenant's exit that can be changed
# in place, and chapter 12 closes Cobalt's exit by setting egress-allow-c to reject (manifests/chapters/12-exit-closed-c.yaml)
# and opens it again by applying this file. The F5SPKEgress objects themselves are never deleted on a running lab:
# the controller does not relearn a namespace's pods for a recreated egress, counts them to zero on the next pod
# restart and then sends CSRC a mapping delete with no tunnel name, which removed another tenant's tunnel (play 8,
# 2026-11-02, docs/egress.md). The tenant isolation itself is the VRF and the SNAT pool.
# Aurora's policy carries one rule more. `cloud-tier` admits TLS (tcp/443) first and logs it, because the Bedrock
# proxy of chapter 15 lives in tenant-a and is the one thing in Aurora's namespace that talks to the internet. The
# rule comes first so that chapter 15 can flip it alone (manifests/chapters/15-cloud-closed-a.yaml): on reject, the
# proxy's SYN to AWS is reset and Aurora's other traffic still matches allow-all. A destination by name
# (destination.fqdns) is in the 2.4.2 CRD as well, but it needs TMM's global FQDN resolver (an F5BigDnsCache of type
# net-resolver), which this lab does not set up. The port rule is the one verified here.
apiVersion: k8s.f5net.com/v1
kind: F5BigFwPolicy
metadata: {name: egress-allow-a, namespace: f5-bnk}
spec:
  rule:
  - {name: cloud-tier, action: accept, logging: true, ipProtocol: tcp, destination: {ports: ["443"]}}
  - {name: allow-all, action: accept, logging: false, ipProtocol: any}
---
apiVersion: k8s.f5net.com/v1
kind: F5BigFwPolicy
metadata: {name: egress-allow-b, namespace: f5-bnk}
spec:
  rule:
  - {name: allow-all, action: accept, logging: false, ipProtocol: any}
---
apiVersion: k8s.f5net.com/v1
kind: F5BigFwPolicy
metadata: {name: egress-allow-c, namespace: f5-bnk}
spec:
  rule:
  - {name: allow-all, action: accept, logging: false, ipProtocol: any}
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKSnatpool
metadata: {name: tenant-a-snat, namespace: f5-bnk}
spec:
  name: tenant-a-snat
  vrf: tenant-a
  addressList: [[10.201.200.10]]
---
apiVersion: k8s.f5net.com/v3
kind: F5SPKEgress
metadata: {name: tenant-a-egress, namespace: f5-bnk}
spec:
  snatType: SRC_TRANS_SNATPOOL
  firewallEnforcedPolicy: egress-allow-a
  egressSnatpool: tenant-a-snat
  pseudoCNIConfig:
    namespaces: [tenant-a]
    appPodInterface: eth0
    vxlan:
      create: true
      tmmInterfaceName: int-a
      vrf: tenant-a
      ipv4Subnet: 10.0.0.0
      ipv4PrefixLen: 18
      ipv6Subnet: "fd00:10:0:0::"
      ipv6PrefixLen: 112
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKSnatpool
metadata: {name: tenant-b-snat, namespace: f5-bnk}
spec:
  name: tenant-b-snat
  vrf: tenant-b
  addressList: [[10.202.200.10]]
---
apiVersion: k8s.f5net.com/v3
kind: F5SPKEgress
metadata: {name: tenant-b-egress, namespace: f5-bnk}
spec:
  snatType: SRC_TRANS_SNATPOOL
  firewallEnforcedPolicy: egress-allow-b
  egressSnatpool: tenant-b-snat
  pseudoCNIConfig:
    namespaces: [tenant-b]
    appPodInterface: eth0
    vxlan:
      create: true
      tmmInterfaceName: int-b
      vrf: tenant-b
      ipv4Subnet: 10.0.64.0
      ipv4PrefixLen: 18
      ipv6Subnet: "fd00:10:0:1::"
      ipv6PrefixLen: 112
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKSnatpool
metadata: {name: tenant-c-snat, namespace: f5-bnk}
spec:
  name: tenant-c-snat
  vrf: tenant-c
  addressList: [[10.203.200.10]]
---
apiVersion: k8s.f5net.com/v3
kind: F5SPKEgress
metadata: {name: tenant-c-egress, namespace: f5-bnk}
spec:
  snatType: SRC_TRANS_SNATPOOL
  firewallEnforcedPolicy: egress-allow-c
  egressSnatpool: tenant-c-snat
  pseudoCNIConfig:
    namespaces: [tenant-c]
    appPodInterface: eth0
    vxlan:
      create: true
      tmmInterfaceName: int-c
      vrf: tenant-c
      ipv4Subnet: 10.0.128.0
      ipv4PrefixLen: 18
      ipv6Subnet: "fd00:10:0:2::"
      ipv6PrefixLen: 112
