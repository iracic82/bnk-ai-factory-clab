# Chapter 5: Aurora's MCP server published on BNK, with an MCP-aware persistence profile on the listener.
#
# The Gateway, the profile, its Secret and the NetPolicy live in BNK's namespace: the controller programs F5's
# extension kinds (F5BigPersistenceProfile, F5BigCneIrule) only there (first full play, 2026-10-31: the same objects
# in tenant-a never got a status and the NetPolicy reported the profile 'does not exist'). The tenant owns the
# HTTPRoute in its own namespace, attached across namespaces, the way the pool VIP works. The passphrase Secret is
# created by the learner (chapter 5) or by solve-factory; it is what TMM encrypts the session cookie with.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: tenant-mcp, namespace: f5-bnk}
spec:
  gatewayClassName: f5-gateway-class
  infrastructure:
    parametersRef: {group: k8s.f5net.com, kind: F5BnkGateway, name: f5-bnkgateway}
  addresses:
  - {type: IPAddress, value: 172.16.100.23}
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Selector
        selector: {matchLabels: {kubernetes.io/metadata.name: tenant-a}}
      kinds: [{group: gateway.networking.k8s.io, kind: HTTPRoute}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-mcp, namespace: tenant-a}
spec:
  parentRefs: [{name: tenant-mcp, namespace: f5-bnk, sectionName: http}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /mcp}}]
    backendRefs: [{name: agent, port: 8001}]
---
apiVersion: k8s.f5net.com/v1
kind: F5BigPersistenceProfile
metadata: {name: tenant-mcp-sessions, namespace: f5-bnk}
spec:
  persistenceType: MODEL_CONTEXT_PROTOCOL
  mcpEncryptionPassphrase:
    secretRef: {name: mcp-passphrase, passphraseField: primary-passphrase}
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: NetPolicy
metadata: {name: tenant-mcp-sessions, namespace: f5-bnk}
spec:
  extensionRefs:
  - {group: k8s.f5net.com, kind: F5BigPersistenceProfile, name: tenant-mcp-sessions}
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: Gateway, name: tenant-mcp, sectionName: http}
