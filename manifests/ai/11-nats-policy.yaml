# Dynamo's NATS (dynamo-platform chart, global.nats.install=true) has no authentication. Without this
# policy any pod could read the KV-cache events or publish fake ones, which would steer BNK's Endpoint
# Picker. Only namespaces labelled aigw.lab/engine=dynamo (the Mocker workers, the Dynamo frontend and the
# BNK Endpoint Picker that runs beside them) and dynamo-system itself may connect on 4222.
# Calico enforces NetworkPolicy in this cluster. Same policy as the BNK x Run:ai lab, own label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-dynamo-clients-only
  namespace: dynamo-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: dynamo-platform
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {aigw.lab/engine: dynamo}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: dynamo-system}
    ports:
    - {protocol: TCP, port: 4222}
