# Who may reach the model backends. TMM's server-side connections come from its internal self IP (one address on
# the node network, __INTERNAL_SELFIP__/32, filled in by install/40-ai.sh) or from the TMM pod itself (namespace
# f5-bnk); the picker and Dynamo's frontend live beside the workers; nothing else gets in, and only on the model
# port and the metrics port. Calico enforces these.
# Open (as on EVE): the F5EPP's secureServing and metricsEndpointAuth are off for the first data-path test.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: models-from-bnk-and-dynamo, namespace: aigw-models}
spec:
  podSelector:
    matchExpressions: [{key: trust.lab/state, operator: NotIn, values: [quarantined]}]
  policyTypes: [Ingress]
  ingress:
  # Dynamo's own traffic (frontend -> worker on the worker's shared TCP endpoint, KV queries, NATS clients) uses
  # ports that are not the pod's declared ones; restricting it to 8000/9090 killed every chat completion with the
  # frontend's five second timeout (first full play, 2026-10-31). Pods of the model and Dynamo namespaces may talk
  # to the model pods on any port; BNK and TMM get the OpenAI port, the picker's gRPC and the metrics port only.
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: aigw-models}}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: dynamo-system}}
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: f5-bnk}}
    - ipBlock: {cidr: __INTERNAL_SELFIP__/32}
    ports: [{port: 8000, protocol: TCP}, {port: 9002, protocol: TCP}, {port: 9090, protocol: TCP}]
