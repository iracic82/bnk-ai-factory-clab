apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  selector:
    matchLabels: {component: agent}
  template:
    metadata:
      labels: {component: agent}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: agent
        image: docker.io/library/python:3.12-alpine
        command: [python, -u, /app/agent.py]
        env:
        - {name: TENANT, value: x}                           # set by the overlay
        - {name: AIGW_URL, value: http://x/v1}             # set by the overlay: the tenant's own AI Gateway tenant
        - {name: MODEL, value: qwen2.5-1.5b}
        - {name: MCP_URL, value: http://127.0.0.1:8001/mcp}
        - {name: APP_VERSION, value: main}
        - name: AIGW_KEY
          valueFrom: {secretKeyRef: {name: aigw-key, key: token, optional: true}}   # install/tenant-agents-setup.sh; chat needs it
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
        resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 128Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: src, mountPath: /app}]
      - name: mcp
        image: docker.io/library/python:3.12-alpine
        command: [python, -u, /app/mcp_server.py]
        env:
        - {name: TENANT, value: x}
        - {name: APP_VERSION, value: main}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: NODE_IP
          valueFrom: {fieldRef: {fieldPath: status.hostIP}}
        ports: [{name: mcp, containerPort: 8001}]
        readinessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 10}
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: src, mountPath: /app}]
      volumes:
      - name: src
        configMap: {name: tenant-agent-src}
