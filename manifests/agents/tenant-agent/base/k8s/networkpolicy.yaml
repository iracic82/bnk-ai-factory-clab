# Ingress isolation for the whole tenant namespace: pods of other tenants (and every other namespace) can't connect.
# Allowed in: the tenant's own pods; kagent (the UI talks to the tenant's kagent Agent, the controller reads the MCP
# tools); and TMM's internal self IPs 10.10.12.41-43 (F5SPKVlan internal), which is where the tenant Gateway's
# traffic comes from (SNAT automap), on the web port only. Kubelet probes come from the pod's own node, which Calico
# always allows. Egress is the BNK side: F5SPKEgress steers the namespace's outbound traffic into the tenant VRF.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {}}]
  - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kagent}}}]
  - from:
    - {ipBlock: {cidr: 10.10.12.41/32}}
    - {ipBlock: {cidr: 10.10.12.42/32}}
    - {ipBlock: {cidr: 10.10.12.43/32}}
    ports: [{protocol: TCP, port: 8080}]
