# Ingress isolation for the whole tenant namespace: pods of other tenants, and every other namespace, cannot connect.
# Allowed in: the tenant's own pods; kagent's controller and UI, on the MCP and web ports only (they list the tenant's
# tools and talk to its Agent); and TMM, which fronts the tenant's published VIP, on the web port only (TMM's
# internal self IP is filled in by install/50-agents.sh). Kubelet probes come from the pod's own node, which Calico
# always allows. Egress is BNK's side: F5SPKEgress steers the namespace's outbound traffic into the tenant VRF, where
# the firewall ACL decides.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {}}]
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kagent}}
      podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [kagent, kagent-controller, kagent-ui]}]}
    ports: [{protocol: TCP, port: 8001}, {protocol: TCP, port: 8080}]
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: f5-bnk}}
    - ipBlock: {cidr: __INTERNAL_SELFIP__/32}
    ports: [{protocol: TCP, port: 8080}]
