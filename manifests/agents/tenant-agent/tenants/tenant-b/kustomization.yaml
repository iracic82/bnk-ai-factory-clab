# tenant-b (Borealis Bank): the tenant agent in namespace tenant-b. Argo CD app tenant-b-agent.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-b
resources: [../../base, assistant.yaml]
patches:
- target: {kind: Deployment, name: agent}
  patch: |-
    - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: "b"}
    - {op: replace, path: /spec/template/spec/containers/0/env/1/value, value: "http://172.16.100.21/v1"}   # AI Gateway tenant tenant-b
    - {op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "tenant-b-qwen2.5-1.5b"}   # this tenant's model name in Polaris
    - {op: replace, path: /spec/template/spec/containers/1/env/0/value, value: "b"}
- target: {kind: Gateway, name: tenant-gw}
  patch: |-
    - {op: replace, path: /spec/addresses/0/value, value: 172.16.100.17}   # outside: 10.10.12.37
- target: {kind: RemoteMCPServer, name: tenant-tools}
  patch: |-
    - {op: replace, path: /spec/url, value: "http://agent.tenant-b.svc.cluster.local:8001/mcp"}
- target: {kind: ModelConfig, name: tenant-model}
  patch: |-
    - {op: replace, path: /spec/openAI/baseUrl, value: "http://172.16.100.21/v1"}
    - {op: replace, path: /spec/model, value: "tenant-b-qwen2.5-1.5b"}
