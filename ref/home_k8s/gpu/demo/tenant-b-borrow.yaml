# tenant-b (quota 2) trains on 6 GPUs while nobody else needs them. A batch Job is preemptible in KAI, so the 4
# borrowed GPUs go back the moment a tenant with quota asks for them (tenant-a-claim.yaml).
apiVersion: batch/v1
kind: Job
metadata: {name: train-burst, namespace: tenant-b}
spec:
  parallelism: 6
  completions: 6
  backoffLimit: 20
  template:
    metadata: {labels: {kai.scheduler/queue: tenant-b, app: gpu-demo}}
    spec:
      schedulerName: kai-scheduler
      terminationGracePeriodSeconds: 1  # sleep ignores SIGTERM
      restartPolicy: Never
      containers:
      - name: train
        image: busybox:1.36
        command: [sh, -c, 'echo "training on $NVIDIA_VISIBLE_DEVICES"; sleep 3600']
        resources: {limits: {nvidia.com/gpu: 1}}
