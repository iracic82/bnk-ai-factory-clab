# agent: web UI and MCP inside the cluster (kagent's RemoteMCPServer uses :8001).
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  selector: {component: agent}
  ports:
  - {name: http, port: 8080, targetPort: http}
  - {name: mcp, port: 8001, targetPort: mcp}
---
# agent-web: backend of the tenant's L4Route (gateway.yaml). Web port only, so the MCP port is never published.
apiVersion: v1
kind: Service
metadata:
  name: agent-web
spec:
  selector: {component: agent}
  ports:
  - {name: http, port: 80, targetPort: http}
