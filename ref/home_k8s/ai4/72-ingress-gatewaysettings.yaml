  name: bnk-vip-settings
  namespace: lab-local
spec:
  ingressConfig:
    defaultListenerNetwork:
      ipamRefs: [{name: vip-gpu-sim}]
      networkRefs: [{name: external}]
      sourceNATConfig: {type: Automap}
---
