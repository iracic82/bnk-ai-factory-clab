# BNK 2.4.1 per-tenant egress, step 2: three tenants, each with its own namespace, SNAT pool and EgressGateway.
# GatewaySettings must sit in the same namespace as its EgressGateway, so a tenant cannot use another tenant's pool.
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels: {bnk.lab/tenant: tenant-a}
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata: {name: tenant-a-settings, namespace: tenant-a}
spec:
  sourceNATPools:
  - name: tenant-a-snat
    ipamRefs: [{name: tenant-a-snat}]
    shared: false
  egressConfigs:
  - name: egress
    hardwareAcceleration: none
    networkRef: {name: egress-v30}
    sourceNATConfig:
      type: Pool
      sourceNATPoolRef: {name: tenant-a-snat}
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: EgressGateway
metadata: {name: tenant-a-egress, namespace: tenant-a}
spec:
  gatewayClassName: f5-gateway-class
  infrastructure:
    parametersRef: {name: tenant-a-settings, sectionName: egress}
  sourceSelector:
    selectionMode: NamespaceSelector
    namespaces: {matchNames: [tenant-a]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: tenant-a}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
      - name: curl
        image: curlimages/curl:8.11.1
        command: [sh, -c, "sleep infinity"]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
