! Tenant egress return path: TMM advertises its per-tenant SNAT /32s over the VLAN 1 BGP session,
! but the flows left TMM on VLAN 30. Pin the return next hop to the same TMM's VLAN 30 self IP.
ip prefix-list TENANT-SNAT seq 5 permit 172.16.200.0/22 ge 32
route-map BNK-IN-11 permit 10
 match ip address prefix-list TENANT-SNAT
 set ip next-hop 172.16.30.11
route-map BNK-IN-11 permit 20
route-map BNK-IN-12 permit 10
 match ip address prefix-list TENANT-SNAT
 set ip next-hop 172.16.30.12
route-map BNK-IN-12 permit 20
route-map BNK-IN-13 permit 10
 match ip address prefix-list TENANT-SNAT
 set ip next-hop 172.16.30.13
route-map BNK-IN-13 permit 20
router bgp 65000
 address-family ipv4
  neighbor 172.16.10.11 route-map BNK-IN-11 in
  neighbor 172.16.10.12 route-map BNK-IN-12 in
  neighbor 172.16.10.13 route-map BNK-IN-13 in
 exit-address-family
! The node->TMM VXLAN underlay is on the node subnet (TMM internal leg), so R5 is not in it: no PAT exemption.
ip access-list standard 10
 no 5
