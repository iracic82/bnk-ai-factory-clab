! R5: VLAN 30 egress network + test "internet" 198.51.100.1 + per-tenant counters
interface Loopback30
 description test-internet target for BNK tenant egress
 ip address 198.51.100.1 255.255.255.0
interface Ethernet0/1.30
 description BNK egress VLAN 30 (Infra egress-v30)
 encapsulation dot1Q 30
 ip address 172.16.30.1 255.255.255.0
 ip access-group TENANT-EGRESS in
ip access-list extended TENANT-EGRESS
 permit ip 172.16.201.0 0.0.0.255 any
 permit ip 172.16.202.0 0.0.0.255 any
 permit ip 172.16.203.0 0.0.0.255 any
 permit ip 172.16.30.0 0.0.0.255 any
 permit ip any any
ip http server
